<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Gallery</title>

<link rel="stylesheet" href="css/photo_gallery.css">

</head>

<body>

<header>
Photo Gallery
</header>

<div class="gallery">

<img src="images/image.png" onclick="openLightbox(this)">
<img src="images/Andrew_bus.png" onclick="openLightbox(this)">

<img id="lightbox-img">
</div>

<footer>
© 2026 Photo Gallery
</footer>

<script src="js/photo_gallery.js"></script>

</html>
