name: HTML Accessibility & SEO Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install axe-selenium-python selenium beautifulsoup4 html5lib

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@latest

      - name: Run accessibility and SEO checks
        id: check
        run: python .github/scripts/check_html.py
        continue-on-error: true

      - name: Check for duplicate issues
        id: duplicate-check
        if: steps.check.outputs.issues_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = JSON.parse(fs.readFileSync('html_issues.json', 'utf8'));
            
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'accessibility,seo'
            });
            
            const newIssues = [];
            
            for (const issue of issues) {
              const isDuplicate = existingIssues.data.some(existing => {
                return existing.title === issue.title && 
                       existing.body.includes(issue.file);
              });
              
              if (!isDuplicate) {
                newIssues.push(issue);
              } else {
                console.log(`Skipping duplicate: ${issue.title}`);
              }
            }
            
            fs.writeFileSync('new_issues.json', JSON.stringify(newIssues, null, 2));
            console.log(`Found ${newIssues.length} new issues to file`);

      - name: File GitHub issues
        if: steps.check.outputs.issues_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('new_issues.json')) {
              console.log('No new issues to file');
              return;
            }
            
            const issues = JSON.parse(fs.readFileSync('new_issues.json', 'utf8'));
            
            for (const issue of issues) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue.title,
                body: issue.body,
                labels: issue.labels
              });
              console.log(`Filed issue: ${issue.title}`);
            }
