name: Validate File Structure
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      file_path:
        description: 'File path to validate (e.g., js/index.js)'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node-based linters
        run: |
          npm install -g eslint stylelint markdownlint-cli html-validate 2>/dev/null || true

      - name: Install Python-based linters
        run: |
          pip install pylint flake8 --quiet 2>/dev/null || true

      - name: Get modified files
        id: modified_files
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FILES="${{ inputs.file_path }}"
            if [ -z "$FILES" ]; then
              echo "files=" >> $GITHUB_OUTPUT
              exit 0
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          # Use EOF delimiter for multiline output
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          echo "Files to validate:"
          echo "$FILES"
        
      - name: Make validation script executable
        run: chmod +x .github/scripts/lint_files.py

      - name: Run file validation
        id: validation
        run: |
          python3 .github/scripts/lint_files.py ${{ steps.modified_files.outputs.files }} 2>&1 | tee /tmp/validation_output.txt
        continue-on-error: true

      - name: Check validation result
        run: |
          python3 .github/scripts/lint_files.py ${{ steps.modified_files.outputs.files }} > /dev/null
          if [ $? -ne 0 ]; then
            echo "VALIDATION_FAILED=true" >> $GITHUB_ENV
          else
            echo "VALIDATION_FAILED=false" >> $GITHUB_ENV
          fi

      - name: Comment on PR with validation results
        if: env.VALIDATION_FAILED == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/validation_output.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **File Validation Failed**\n\n\`\`\`\n${output}\n\`\`\`\n\n**Commit**: ${context.sha.substring(0, 7)}`
            });

      - name: Fail workflow if validation failed
        if: env.VALIDATION_FAILED == 'true'
        run: exit 1
