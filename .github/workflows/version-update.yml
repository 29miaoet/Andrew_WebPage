name: Replace version numbers after release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  replace-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine versions and replace
        run: |
          set -e
          NEW_TAG="${GITHUB_REF_NAME}"
          NEW_VERSION="${NEW_TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${NEW_TAG}$" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag, skipping"
            exit 0
          fi
          
          PREV_VERSION="${PREV_TAG#v}"
          
          # Replace versions
          sed -i "s/$PREV_VERSION/$NEW_VERSION/g" README.md file_download.html js/file_download.js
          
          # Commit and push directly
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: replace $PREV_VERSION with $NEW_VERSION" || echo "No changes"
          git push
