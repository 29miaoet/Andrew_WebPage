name: Replace version numbers after release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  replace-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous and current versions
        id: versions
        run: |
          set -e
          NEW_TAG="${GITHUB_REF_NAME}"
          NEW_VERSION="${NEW_TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${NEW_TAG}$" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            echo "SKIP_REPLACEMENT=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          PREV_VERSION="${PREV_TAG#v}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "PREV_VERSION=$PREV_VERSION" >> $GITHUB_ENV
          echo "SKIP_REPLACEMENT=false" >> $GITHUB_OUTPUT

      - name: Replace all occurrences
        if: steps.versions.outputs.SKIP_REPLACEMENT == 'false'
        run: |
          sed -i "s/$PREV_VERSION/$NEW_VERSION/g" README.md file_download.html js/file_download.js

      - name: Create Pull Request
        if: steps.versions.outputs.SKIP_REPLACEMENT == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "chore/version-${{ env.NEW_VERSION }}"
          git add .
          git commit -m "chore: replace ${{ env.PREV_VERSION }} with ${{ env.NEW_VERSION }}"
          git push origin "chore/version-${{ env.NEW_VERSION }}"
          gh pr create --base main --title "chore: replace ${{ env.PREV_VERSION }} with ${{ env.NEW_VERSION }}" --body "Automated version update"
