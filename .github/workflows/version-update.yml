name: Replace version numbers after release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  replace-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version numbers
        id: versions
        run: |
          NEW_TAG="${GITHUB_REF_NAME}"
          NEW_VERSION="${NEW_TAG#v}"
          
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${NEW_TAG}$" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found"
            exit 0
          fi
          
          PREV_VERSION="${PREV_TAG#v}"
          
          echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Replacing: $PREV_VERSION → $NEW_VERSION"

      - name: Replace versions in files
        if: steps.versions.outputs.prev_version != ''
        run: |
          sed -i "s/${{ steps.versions.outputs.prev_version }}/${{ steps.versions.outputs.new_version }}/g" README.md file_download.html js/file_download.js

      - name: Create Pull Request
        if: steps.versions.outputs.prev_version != ''
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: replace ${{ steps.versions.outputs.prev_version }} with ${{ steps.versions.outputs.new_version }}"
          title: "chore: replace ${{ steps.versions.outputs.prev_version }} with ${{ steps.versions.outputs.new_version }}"
          body: "Automated version replacement"
          branch: "chore/version-${{ steps.versions.outputs.new_version }}"
