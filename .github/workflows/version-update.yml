      - name: Push changes via new branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch origin main
          git fetch origin main:main
          
          # Create and checkout new branch from main
          BRANCH="chore/version-${{ env.NEW_VERSION }}"
          git checkout -b "$BRANCH" main
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Commit
          git add README.md file_download.html js/file_download.js
          git commit -m "chore: replace ${{ env.PREV_VERSION }} with ${{ env.NEW_VERSION }}"
          
          # Push the new branch
          git push -u origin "$BRANCH"
          
          # Create PR
          gh pr create \
            --base main \
            --title "chore: replace ${{ env.PREV_VERSION }} with ${{ env.NEW_VERSION }}" \
            --body "Automated version replacement"
