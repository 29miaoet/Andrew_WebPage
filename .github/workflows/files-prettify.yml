name: Prettify Files

on:
  push:
    branches:
      - main
    paths:
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.md'
      - '*.yml'
      - '*.yaml'

jobs:
  prettify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Prettier (temporary, not saved)
        run: npm install --no-save prettier

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            *.css
            *.js
            *.json
            *.md
            *.yml
            *.yaml

      - name: Prettify changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$file" ]; then
              echo "Prettifying: $file"
              npx prettier --write "$file"
            fi
          done

      - name: Clean up npm artifacts
        run: |
          rm -rf node_modules/
          rm -f package-lock.json
          git checkout -- package.json 2>/dev/null || true

      - name: Check if files were modified
        id: verify
        run: |
          if git diff --quiet; then
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "modified=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'style: prettify files'
          title: 'style: Auto-prettify files'
          body: |
            ## Automated Prettification
            
            This PR contains automatically prettified files detected in the recent commit.
            
            **Changes:**
            - Files formatted with Prettier
            
            Please review and merge if the formatting looks good.
          branch: prettify/auto-format
          delete-branch: true
          labels: 'auto-generated,formatting'
