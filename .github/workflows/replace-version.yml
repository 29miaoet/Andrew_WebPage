name: Update Version After Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prev_version:
        description: "Previous version"
        required: true
      new_version:
        description: "New version"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine versions
        id: versions
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PREV_VERSION="${{ inputs.prev_version }}"
            NEW_VERSION="${{ inputs.new_version }}"
          else
            NEW_TAG="${GITHUB_REF_NAME}"
            NEW_VERSION="${NEW_TAG#v}"
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${NEW_TAG}$" | head -n 1)
            PREV_VERSION="${PREV_TAG#v}"
          fi
          echo "prev=$PREV_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update files
        if: steps.versions.outputs.prev != ''
        run: sed -i "s/${{ steps.versions.outputs.prev }}/${{ steps.versions.outputs.new }}/g" README.md file_download.html js/file_download.js

      - name: Create Pull Request
        if: steps.versions.outputs.prev != ''
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: version update"
          title: "chore: version update"
          body: "Automated version replacement"
          branch: "chore/version-${{ steps.versions.outputs.new }}"
          base: main
