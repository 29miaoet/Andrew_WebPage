<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, follow">
    <title>Guest Book</title>
    <link rel="stylesheet" href="css/signature_page.css">
	<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
	
</head>
<body>
    <div class="container">
        <header>
            <h1>Guest Book</h1>
            <p>Leave your mark to Andrew's Website</p>
        </header>

        <div class="main-content">
            <div class="card">
                <h2>Sign Here</h2>
                <form id="signatureForm">
                    <div class="form-group">
                        <label for="name">Your Name *</label>
                        <input 
                            type="text" 
                            id="name" 
                            placeholder="Enter your name" 
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="email">Email (optional)</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="your@email.com"
                        >
                    </div>
                    <div class="form-group">
                        <label for="message">Message (optional)</label>
                        <textarea 
                            id="message" 
                            placeholder="Leave a message or note..."
                            rows="3"
                        ></textarea>
                    </div>
                    <button type="submit">Sign the Book</button>
                    <div id="submitStatus" class="status"></div>
                </form>
            </div>

            <div class="card">
                <h2>
                    Signatures 
                    <span class="count" id="signatureCount">0</span>
                </h2>
                <div class="signatures-container" id="signaturesContainer">
                    <div class="loading">Loading signatures...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/signature_page.js"></script>
</body>
</html>
