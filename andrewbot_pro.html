<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A frontend AI chat app that can execute browser actions, powered by Groq API.">
<link rel="manifest" href="data/manifest.webmanifest">

<title>Andrew Stanish | AndrewBot Pro</title>
<link rel="stylesheet" href="css/base/theme.css">
<link rel="stylesheet" href="css/elements/home_button.css">
<link rel="stylesheet" href="css/andrewbot_pro.css">

<link href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">

<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="canonical" href="https://29miaoet.github.io/Andrew_WebPage/form.html">
</head>

<body>
<a href="./" class="mini-home-btn" aria-label="Home">
  <span class="home-icon">🏠</span>
  <span class="home-text">Home</span>
</a>

<div class="app-layout">
  <!-- Sidebar Addition -->
  <div id="sidebar">
    <button id="newChatBtn">+ New Chat</button>
    <div id="chatHistory"></div>
  </div>

  <!-- Main Content Wrapper -->
  <div class="main-content">
    <div class="container">
      <h2>AndrewBot Pro</h2>

      <label for="apiKey">API Key</label>
      <div class="input-row">
        <input id="apiKey" class="input-field" placeholder="Enter API key">
      </div>

      <label for="model">Model</label>
      <select id="model" class="input-field">
        <option value="openai/gpt-oss-120b">GPT OSS 120B (recommended)</option>
        <option value="groq/compound">Groq Compound (smart)</option>
        <option value="qwen/qwen3.6-27b">Qwen 3.6 27B</option>
        <option value="groq/compound-mini">Groq Compound Mini</option>
        <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
        <option value="qwen/qwen3-32b">Qwen 3 32B</option>
        <option value="llama-3.1-8b-instant">LLaMA 3.1 8B</option>
        <option value="llama-3.3-70b-versatile">LLaMA 3.3 70B</option>
      </select>

      <div id="chat"></div>

      <div class="input-row">
        <textarea id="input" class="input-field" rows="1" placeholder="Type a message..." aria-label="Chat input"></textarea>
        <button id="sendBtn" type="button">Send</button>
        <button id="clearBtn" type="button">Clear All History</button>
      </div>
      <footer>AndrewBot Pro - Created by Ethan Miao</footer>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.10/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsonrepair@3.14.0/lib/umd/jsonrepair.min.js"></script>
<script src="js/andrewbot_pro.js"></script>

</body>
</html>
