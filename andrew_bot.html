<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A smart AI assistant to help users get to know Andrew">
  <link rel="manifest" href="data/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/base/theme.css">
  <link rel="stylesheet" href="css/elements/home_button.css">
  <link rel="stylesheet" href="css/andrew_bot.css">
  <title>Andrew Stanish | AndrewBot</title>
  <link rel="canonical" href="https://29miaoet.github.io/Andrew_WebPage/andrew_bot.html">

</head>


<body>
  <a href="./" class="mini-home-btn" aria-label="Home">
    <span class="home-icon">🏠</span>
    <span class="home-text">Home</span>
  </a>
  <div class="container">
    <h1>AndrewBot (Smart AI Assistant)</h1>
    <div id="chat"></div>
    <div class="input-area">
      <input id="input" type="text" placeholder="Type a message..." aria-label="Message input">
      <button id="send">Send</button>
    </div>
    <div class="button-container">
      <button id="clear">Clear History</button>
      <button id="toggleCommands" class="toggle-btn active">Commands: ON</button>
      <button id="toggleTraining" class="toggle-btn active">Training: ON</button>
    </div>

  </div>

<script type="module" src="js/andrew_bot.js"></script>
<script src="js/service_worker_register.js"></script>

</body>
</html>
