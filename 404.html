<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="https://29miaoet.github.io/Andrew_WebPage/images/favicon.svg">
<title>404 - Full Panic Mode</title>

<!-- Inline styles for speed and reliability -->
<style>
* {
    box-sizing: border-box;
}

html,
body {
    background-color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: system-ui, sans-serif;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;

    padding: 2rem;
    border-radius: 20px;

}

h1 {
    margin: 0;
    font-size: clamp(5rem, 15vw, 8rem);
    line-height: 1;
    font-weight: 400;
}

img {
    width: min(200px, 50%);
    height: auto;
    margin: 10px 0;
}

.error-code {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
}

.bold {
    font-weight: bold;
    font-size: 18px;
}

p {
    font-size: 16px;
}

.button-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

a {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    background-color: #00b4ff;
    text-decoration: none;
    color: white;
    text-decoration: none;

    font-size: 14px;
    font-weight: 600;

    transition:
        transform .15s ease,
        background-color .15s ease;
}

.button-container a:hover {
    transform: translateY(-2px);
    background-color: #009fe0;
}
</style>

</head>
<body>
<div class="container">

    <h1>404</h1>
    <p class="error-code">Page Not Found</p>

    <img src="https://29miaoet.github.io/Andrew_WebPage/images/favicon.svg" alt="Logo and favicon of Andrew's Website">

    <p class="bold">
        The page you requested does not exist.
    </p>

<p>Either it was moved recently, never existed, or was mysteriously hidden by the browser. (Probably the latter).</p>
<p>Please try one of the links below.</p>
<nav class="button-container">
    <a href="https://29miaoet.github.io/Andrew_WebPage/">Home</a>
    <a href="https://29miaoet.github.io/Andrew_WebPage/search_engine.html">Search</a>
    <a href="#" onclick="history.back(); return false;">Go Back</a>
</nav>

</div>
</body>
</html>
