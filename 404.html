<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>404 - Full Panic Mode</title>

<!-- Inline styles for speed and reliability -->
<style>
* {
    box-sizing: border-box;
}

body {
    background-color: #e0e0e0;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
}

h1 {
    font-size: 60px;
    font-weight: 600;
}

img {
    width: 40%;
    height: auto;
}

.container {
    margin-top: 40px;
    text-align: center;
    width: 600px;
}

.button-container {
    display: flex;
    flex-direction: column;
    padding: 10px;
}

a {
    padding: 12px 24px;
    border: none;
    border-radius: var(--radius-md);
    background-color: var(--color-accent);
    text-decoration: none;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 10px;
}

a:hover {
    transform: translateY(-2px);
}

p {
    font-size: 16px;
}

.bold {
    font-weight: bold;
    font-size: 18px;
}


</style>

</head>
<body>
<div class=container>
<h1>404</h1>
<img src="https://29miaoet.github.io/Andrew_WebPage/images/favicon.svg" alt="Logo and favicon of Andrew's Website">
<p class="bold">The page you requested does not exist.</p>
<p>Either it was moved recently, never existed, or was mysteriously hidden by the browser. (Probably the latter).</p>
<p>Please try one of the links below.</p>
<nav class="button-container">
<a href="https://29miaoet.github.io/Andrew_WebPage/">Home</a>
<a href="https://29miaoet.github.io/Andrew_WebPage/search_engine.html">Search</a>
</nav>

</div>

</body>
</html>
